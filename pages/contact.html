<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Evan Wallet</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/nav.css" />
  <link rel="stylesheet" href="../css/contact.css" />
  <link rel="stylesheet" href="../css/home.css" />
</head>
<body>

  <header id="header"></header>

  <main class="contact-page">

    <p class="contact-display" aria-hidden="true">GET IN<br>TOUCH</p>

    <div class="contact-layout">

      <div class="contact-info">
        <p class="contact-info__eyebrow">Contact</p>

        <div class="contact-info__line">
          <span class="contact-info__label">Email</span>
          <a href="mailto:evanwallet06@gmail.com" class="contact-info__value">evanwallet06@gmail.com</a>
        </div>

        <div class="contact-info__line">
          <span class="contact-info__label">Based In</span>
          <span class="contact-info__value">Fort Wayne, IN</span>
        </div>

        <div class="contact-info__line">
          <span class="contact-info__label">Available For</span>
          <span class="contact-info__value">Freelance, Commissions,<br>Collaborations</span>
        </div>

        <div class="contact-socials">
          <a href="https://instagram.com/evan_wallet/" target="_blank" rel="noopener" class="contact-social-link">INSTAGRAM</a>
          <a href="https://www.youtube.com/@EvanWallet" target="_blank" rel="noopener" class="contact-social-link">YOUTUBE</a>
          <a href="https://www.linkedin.com/in/evan-wallet-280b5837a/" target="_blank" rel="noopener" class="contact-social-link">LINKEDIN</a>
        </div>
      </div>

      <div class="contact-form-wrap">
        <p class="contact-form__eyebrow">Send a Message</p>

        <form class="contact-form" id="contact-form" action="https://formspree.io/f/xpqgbbjq" method="POST">
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required />
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required />
          </div>

          <div class="form-field">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Project inquiry, collaboration…" />
          </div>

          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Tell me about your project…" required></textarea>
          </div>

          <div class="form-submit">
            <button type="submit" class="btn-submit">SEND MESSAGE</button>
            <span class="form-note">I typically respond within 48 hours.</span>
          </div>
        </form>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-copy">© <span id="year"></span> Evan Wallet</span>
    </div>
    <div class="footer-center">
      <a href="../index.html" class="footer-name">EVAN WALLET</a>
    </div>
    <div class="footer-right">
      <a href="https://instagram.com/evan_wallet/" target="_blank" rel="noopener" class="footer-link">INSTAGRAM</a>
      <a href="https://www.youtube.com/@EvanWallet" target="_blank" rel="noopener" class="footer-link">YOUTUBE</a>
      <a href="https://www.linkedin.com/in/evan-wallet-280b5837a/" target="_blank" rel="noopener" class="footer-link">LINKEDIN</a>
    </div>
  </footer>

  <script src="../js/replicator.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
